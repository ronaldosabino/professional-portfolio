<header class="fixed-top bg-body shadow-sm border-bottom">

    <nav class="navbar navbar-expand-lg py-3" aria-label="Navegação principal">

        <div class="container">

            <!-- LOGO -->
            <a routerLink="/" class="navbar-brand d-flex align-items-center" aria-label="Ir para a página inicial">
                <i class="fa-brands fa-resolving fs-1 text-primary"></i>
            </a>


            <!-- NAVEGAÇÃO DESKTOP -->
            <div class="d-none d-lg-flex align-items-center gap-4">

                <ul class="navbar-nav gap-2">

                    <li class="nav-item">

                        <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link" aria-current="page">
                            Home
                        </a>

                    </li>


                    <li class="nav-item">

                        <a routerLink="/about" routerLinkActive="active" class="nav-link">
                            Sobre
                        </a>

                    </li>


                    <li class="nav-item">

                        <a routerLink="/skills" routerLinkActive="active" class="nav-link">
                            Habilidades
                        </a>

                    </li>


                    <li class="nav-item">

                        <a routerLink="/projects" routerLinkActive="active" class="nav-link">
                            Projetos
                        </a>

                    </li>


                    <li class="nav-item">

                        <a routerLink="/experiences" routerLinkActive="active" class="nav-link">
                            Experiências
                        </a>

                    </li>


                    <li class="nav-item">

                        <a routerLink="/education" routerLinkActive="active" class="nav-link">
                            Educação
                        </a>

                    </li>


                    <li class="nav-item">

                        <a routerLink="/contact" routerLinkActive="active" class="nav-link">
                            Contato
                        </a>

                    </li>

                </ul>


                <!-- AJUSTES -->
                <a routerLink="/settings" routerLinkActive="active" class="btn btn-link text-secondary p-2" aria-label="Abrir ajustes" title="Ajustes">
                    <i class="bi bi-gear fs-5"></i>
                </a>

            </div>


            <!-- BOTÃO MENU MOBILE -->
            <button type="button" class="btn p-0 border-0 d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu" aria-controls="mobileMenu" aria-label="Abrir menu">
                <i class="bi bi-list fs-1"></i>
            </button>

        </div>

    </nav>

</header>


<!-- MENU LATERAL MOBILE -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="mobileMenu" aria-labelledby="mobileMenuLabel">

    <!-- CABEÇALHO -->
    <div class="offcanvas-header border-bottom py-4">

        <h2 class="offcanvas-title fs-5 fw-bold" id="mobileMenuLabel">
            Menu
        </h2>

        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar menu"></button>

    </div>


    <!-- CONTEÚDO -->
    <div class="offcanvas-body d-flex flex-column">

        <nav aria-label="Navegação mobile">

            <ul class="navbar-nav gap-2">

                <li class="nav-item">

                    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link py-3 px-3 rounded-3" data-bs-dismiss="offcanvas">
                        <i class="bi bi-house me-2"></i>
                        Início
                    </a>

                </li>


                <li class="nav-item">

                    <a routerLink="/about" routerLinkActive="active" class="nav-link py-3 px-3 rounded-3" data-bs-dismiss="offcanvas">
                        <i class="bi bi-person me-2"></i>
                        Sobre
                    </a>

                </li>


                <li class="nav-item">

                    <a routerLink="/skills" routerLinkActive="active" class="nav-link py-3 px-3 rounded-3" data-bs-dismiss="offcanvas">
                        <i class="bi bi-code-slash me-2"></i>
                        Habilidades
                    </a>

                </li>


                <li class="nav-item">

                    <a routerLink="/projects" routerLinkActive="active" class="nav-link py-3 px-3 rounded-3" data-bs-dismiss="offcanvas">
                        <i class="bi bi-folder me-2"></i>
                        Projetos
                    </a>

                </li>


                <li class="nav-item">

                    <a routerLink="/experiences" routerLinkActive="active" class="nav-link py-3 px-3 rounded-3" data-bs-dismiss="offcanvas">
                        <i class="bi bi-briefcase me-2"></i>
                        Experiências
                    </a>

                </li>


                <li class="nav-item">

                    <a routerLink="/education" routerLinkActive="active" class="nav-link py-3 px-3 rounded-3" data-bs-dismiss="offcanvas">
                        <i class="bi bi-mortarboard me-2"></i>
                        Educação
                    </a>

                </li>


                <li class="nav-item">

                    <a routerLink="/contact" routerLinkActive="active" class="nav-link py-3 px-3 rounded-3" data-bs-dismiss="offcanvas">
                        <i class="bi bi-envelope me-2"></i>
                        Contato
                    </a>

                </li>


                <!-- DIVISOR -->
                <li>
                    <hr class="my-3">
                </li>


                <!-- AJUSTES -->
                <li class="nav-item">

                    <a routerLink="/settings" routerLinkActive="active" class="nav-link py-3 px-3 rounded-3" data-bs-dismiss="offcanvas">
                        <i class="bi bi-gear me-2"></i>
                        Ajustes
                    </a>

                </li>

            </ul>

        </nav>


        <!-- RODAPÉ DO MENU -->
        <div class="mt-auto pt-4">

            <div class="border-top pt-4">

                <p class="text-secondary small mb-1">
                    Ronaldo Sabino
                </p>

                <p class="text-secondary small mb-0">
                    Analista e Desenvolvedor de Sistemas
                </p>

            </div>

        </div>

    </div>

</div>
